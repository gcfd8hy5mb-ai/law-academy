name: Level 5 Mobile Browser Acceptance
on:
  push:
    paths:
      - 'level5*.js'
      - 'app.js'
      - 'index.html'
      - 'tests/level5-coursework.spec.mjs'
      - '.github/workflows/level5-mobile-qa.yml'
  pull_request:
    paths:
      - 'level5*.js'
      - 'app.js'
      - 'index.html'
      - 'tests/level5-coursework.spec.mjs'
      - '.github/workflows/level5-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser testing
        run: npm install --no-save --no-package-lock @playwright/test@1.58.2
      - name: Install WebKit test browser
        run: npx playwright install --with-deps webkit
      - name: Test Level 5 with iPhone-sized WebKit
        run: npx playwright test tests/level5-coursework.spec.mjs --project=mobile-webkit
