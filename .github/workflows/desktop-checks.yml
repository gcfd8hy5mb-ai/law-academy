name: Desktop checks
on:
  push:
    branches: [feature/desktop-academy]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/desktop-integration.test.cjs

      - name: Install browser testing dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify desktop browser interactions
        run: node tests/desktop-browser.cjs
