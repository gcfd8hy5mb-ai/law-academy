name: Level 4 Curriculum and Exam QA
on:
  push:
    paths:
      - 'level4*.js'
      - 'law-level4-finals-cloud.js'
      - 'law-firebase-cloud-v4.js'
      - 'scripts/law-finals-cloud-plan.mjs'
      - 'scripts/verify-level4-finals-cloud.mjs'
      - 'scripts/validate-level4-finals-cloud-behavior.mjs'
      - 'index.html'
      - 'scripts/verify-level4*.cjs'
      - 'scripts/fixtures/level4-final-browser.html'
      - '.github/workflows/level4-qa.yml'
  pull_request:
    paths:
      - 'level4*.js'
      - 'index.html'
      - 'scripts/verify-level4*.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-level4:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 100 lessons, answer keys, and rubrics
        run: node scripts/verify-level4.cjs
      - name: Verify practical final cloud merge safety
        run: node scripts/verify-level4-finals-cloud.mjs
      - name: Simulate six finals-only Firestore paths
        run: node scripts/validate-level4-finals-cloud-behavior.mjs
      - name: Simulate all seven exam flows
        run: node scripts/verify-level4-final-interactions.cjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop and mobile Chromium practical final tests
        run: node scripts/verify-level4-browser.cjs
      - name: Run Safari-engine WebKit practical final tests
        run: LAW_QA_BROWSER=webkit node scripts/verify-level4-browser.cjs
