name: Law Academy independent-review preparation

on:
  pull_request:
    paths:
      - 'scripts/audit-five-level-readiness.mjs'
      - '.github/workflows/audit-academic-readiness.yml'
      - 'level2.js'
      - 'level3.js'
      - 'level4.js'
      - 'app.js'
      - 'bar-simulator-data.js'
  push:
    branches:
      - 'audit/law-five-level-source-triage-20261115'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-source-triage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit generator syntax
        run: node --check scripts/audit-five-level-readiness.mjs
      - name: Generate reproducible curriculum and source-review queue
        run: node scripts/audit-five-level-readiness.mjs
      - name: Preserve academic review report as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: law-academic-readiness-audit
          path: |
            audit/five-level-academic-review-queue.csv
            audit/five-level-readiness-summary.json
          retention-days: 30
