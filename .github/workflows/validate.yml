name: Validate Law Academy

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curricula, quiz integrity, and script syntax
        run: node scripts/validate-content.mjs
      - name: Check HTML entrypoint and app assets
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          node --check app.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps webkit
      - name: Test iPhone-sized WebKit interactions
        run: npx playwright test --reporter=line,html
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: law-academy-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
