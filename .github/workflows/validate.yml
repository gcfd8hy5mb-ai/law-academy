name: Validate Law Academy

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'prelaw-applied.js'
      - 'level2.js'
      - 'level3.js'
      - 'level3-ui.js'
      - 'index.html'
      - 'law-firebase-cloud-v3.js'
      - 'firebase-config.js'
      - 'styles.css'
      - 'scripts/**'
      - 'curriculum/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'prelaw-applied.js'
      - 'level2.js'
      - 'level3.js'
      - 'level3-ui.js'
      - 'index.html'
      - 'law-firebase-cloud-v3.js'
      - 'firebase-config.js'
      - 'styles.css'
      - 'scripts/**'
      - 'curriculum/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curricula, quiz integrity, and script syntax
        run: |
          node scripts/validate-content.mjs
          node --check level2.js
          node --check level3.js
          node --check level3-ui.js
          node scripts/validate-level3.mjs
      - name: Generate 70-lesson Level 3 legal-source review inventory
        run: node scripts/audit-level3-sources.mjs
      - name: Upload Level 3 source audit inventory
        uses: actions/upload-artifact@v4
        with:
          name: level3-source-review-inventory
          path: audit/level3-source-review-inventory.csv
          retention-days: 30
      - name: Generate 85-lesson legal-source review inventory
        run: node scripts/audit-prelaw-sources.mjs
      - name: Upload source audit inventory
        uses: actions/upload-artifact@v4
        with:
          name: prelaw-source-review-inventory
          path: audit/prelaw-85-source-review.csv
          retention-days: 30
      - name: Check HTML entrypoint and app assets
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          node --check app.js
          node --check prelaw-applied.js
          node --check level2.js
          node --check law-firebase-cloud-v3.js
          node --check firebase-config.js
          node scripts/validate-firebase-entrypoint.mjs

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps webkit
      - name: Test iPhone-sized WebKit interactions
        run: npx playwright test --reporter=line,html --trace=retain-on-failure
      - name: Record browser test completion status
        if: always()
        run: |
          echo '### Law Academy browser verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: \`${{ github.sha }}\`' >> "$GITHUB_STEP_SUMMARY"
          echo 'The browser-smoke job result and uploaded Playwright report are the authoritative pass/fail evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law-academy-browser-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
